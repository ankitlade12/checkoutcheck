<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#56716a"/></marker></defs><rect width="1800" height="1200" fill="#f8faf9"/><text x="60" y="66" font-family="Arial" font-size="36" font-weight="bold" fill="#173c30">CheckoutCheck — From Evidence to Review</text><text x="60" y="104" font-family="Arial" font-size="21" fill="#56716a">Image evaluation workflow with traceable tool choices and a separate scoring boundary</text><rect x="60" y="175" width="390" height="880" rx="16" fill="#fff" stroke="#cddbd5" stroke-width="2"/><text x="84" y="213" font-family="Arial" font-size="19" font-weight="bold" letter-spacing="1" fill="#526b61">STEP 1 · ORIGINAL INPUTS</text><rect x="490" y="175" width="390" height="880" rx="16" fill="#fff" stroke="#cddbd5" stroke-width="2"/><text x="514" y="213" font-family="Arial" font-size="19" font-weight="bold" letter-spacing="1" fill="#526b61">STEP 2 · PERCEPTION</text><rect x="920" y="175" width="390" height="880" rx="16" fill="#fff" stroke="#cddbd5" stroke-width="2"/><text x="944" y="213" font-family="Arial" font-size="19" font-weight="bold" letter-spacing="1" fill="#526b61">STEP 3 · DECISION + TRACE</text><rect x="1350" y="175" width="390" height="880" rx="16" fill="#fff" stroke="#cddbd5" stroke-width="2"/><text x="1374" y="213" font-family="Arial" font-size="19" font-weight="bold" letter-spacing="1" fill="#526b61">STEP 4 · EVALUATE + REVIEW</text><rect x="80" y="260" width="350" height="150" rx="11" fill="#eaf5ff" stroke="#3782b6" stroke-width="2"/><text x="100" y="294" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Original photographs</text><text x="100" y="325" font-family="Arial" font-size="19" fill="#455f54">RPC validation photographs</text><text x="100" y="352" font-family="Arial" font-size="19" fill="#455f54">Separate training references</text><text x="100" y="379" font-family="Arial" font-size="19" fill="#455f54">Publisher source attribution</text><rect x="80" y="500" width="350" height="150" rx="11" fill="#eaf5ff" stroke="#3782b6" stroke-width="2"/><text x="100" y="534" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Verify inputs</text><text x="100" y="565" font-family="Arial" font-size="19" fill="#455f54">Source manifest + checksums</text><text x="100" y="592" font-family="Arial" font-size="19" fill="#455f54">Image dimensions and IDs</text><text x="100" y="619" font-family="Arial" font-size="19" fill="#455f54">Registered model provenance</text><rect x="510" y="260" width="350" height="150" rx="11" fill="#fff3df" stroke="#d18a28" stroke-width="2"/><text x="530" y="294" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">OpenCV 5 observations</text><text x="530" y="325" font-family="Arial" font-size="19" fill="#455f54">Decode and preprocess</text><text x="530" y="352" font-family="Arial" font-size="19" fill="#455f54">Measure image sharpness</text><text x="530" y="379" font-family="Arial" font-size="19" fill="#455f54">Foreground density + warnings</text><rect x="510" y="500" width="350" height="150" rx="11" fill="#fff3df" stroke="#d18a28" stroke-width="2"/><text x="530" y="534" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Select the next tool</text><text x="530" y="565" font-family="Arial" font-size="19" fill="#455f54">Dense / warning → neural</text><text x="530" y="592" font-family="Arial" font-size="19" fill="#455f54">Clear foreground → watershed</text><text x="530" y="619" font-family="Arial" font-size="19" fill="#455f54">Low sharpness → inspection</text><rect x="940" y="260" width="350" height="150" rx="11" fill="#f3edfc" stroke="#8c67b4" stroke-width="2"/><text x="960" y="294" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Bounded tool execution</text><text x="960" y="325" font-family="Arial" font-size="19" fill="#455f54">At most three calls per image</text><text x="960" y="352" font-family="Arial" font-size="19" fill="#455f54">Record observations + timing</text><text x="960" y="379" font-family="Arial" font-size="19" fill="#455f54">Retain initial result on failure</text><rect x="940" y="500" width="350" height="150" rx="11" fill="#fcecf1" stroke="#b85a78" stroke-width="2"/><text x="960" y="534" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Inspection recommendation</text><text x="960" y="565" font-family="Arial" font-size="19" fill="#455f54">Tool failure or poor quality</text><text x="960" y="592" font-family="Arial" font-size="19" fill="#455f54">Count disagreement</text><text x="960" y="619" font-family="Arial" font-size="19" fill="#455f54">No automatic transaction action</text><rect x="1370" y="260" width="350" height="150" rx="11" fill="#e8f5ec" stroke="#41865c" stroke-width="2"/><text x="1390" y="294" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Score predictions</text><text x="1390" y="325" font-family="Arial" font-size="19" fill="#455f54">One-to-one IoU matching</text><text x="1390" y="352" font-family="Arial" font-size="19" fill="#455f54">Precision, recall and count error</text><text x="1390" y="379" font-family="Arial" font-size="19" fill="#455f54">Reference labels enter here</text><rect x="1370" y="500" width="350" height="150" rx="11" fill="#e8f5ec" stroke="#41865c" stroke-width="2"/><text x="1390" y="534" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Inspect and compare</text><text x="1390" y="565" font-family="Arial" font-size="19" fill="#455f54">Reference / prediction overlays</text><text x="1390" y="592" font-family="Arial" font-size="19" fill="#455f54">Method comparison on same data</text><text x="1390" y="619" font-family="Arial" font-size="19" fill="#455f54">Reproducible evidence export</text><rect x="80" y="785" width="350" height="150" rx="11" fill="#f2f5f6" stroke="#8b9ca5" stroke-width="2"/><text x="100" y="819" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Data provenance</text><text x="100" y="850" font-family="Arial" font-size="19" fill="#455f54">Original source material</text><text x="100" y="877" font-family="Arial" font-size="19" fill="#455f54">No invented scan histories</text><text x="100" y="904" font-family="Arial" font-size="19" fill="#455f54">Preserve dataset licenses</text><rect x="510" y="785" width="350" height="150" rx="11" fill="#f2f5f6" stroke="#8b9ca5" stroke-width="2"/><text x="530" y="819" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Executed on AWS</text><text x="530" y="850" font-family="Arial" font-size="19" fill="#455f54">OpenCV application pipelines</text><text x="530" y="877" font-family="Arial" font-size="19" fill="#455f54">Optional PyTorch inference</text><text x="530" y="904" font-family="Arial" font-size="19" fill="#455f54">COOL benchmark on Graviton</text><rect x="940" y="785" width="350" height="150" rx="11" fill="#f2f5f6" stroke="#8b9ca5" stroke-width="2"/><text x="960" y="819" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Observable decisions</text><text x="960" y="850" font-family="Arial" font-size="19" fill="#455f54">Selected tool + reason</text><text x="960" y="877" font-family="Arial" font-size="19" fill="#455f54">Completion / failure status</text><text x="960" y="904" font-family="Arial" font-size="19" fill="#455f54">Human inspection request</text><rect x="1370" y="785" width="350" height="150" rx="11" fill="#f2f5f6" stroke="#8b9ca5" stroke-width="2"/><text x="1390" y="819" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Measured evidence</text><text x="1390" y="850" font-family="Arial" font-size="19" fill="#455f54">24 evaluation photographs</text><text x="1390" y="877" font-family="Arial" font-size="19" fill="#455f54">Trace and scoring downloads</text><text x="1390" y="904" font-family="Arial" font-size="19" fill="#455f54">Failure cases remain visible</text><path d="M255 410V500" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M430 575H465V335H510" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M685 410V500" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M860 575H900V335H940" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M1290 335H1370" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M1115 410V500" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M1290 575H1370" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M1545 410V500" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><text x="60" y="1130" font-family="Arial" font-size="21" fill="#526b61">Reference annotations are withheld from inference and agent routing. Human inspection is recommended, never automatically enforced.</text></svg>