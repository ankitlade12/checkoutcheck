<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L8 3Z" fill="#56716a"/></marker></defs><rect width="1800" height="1200" fill="#f8faf9"/><text x="60" y="66" font-family="Arial" font-size="36" font-weight="bold" fill="#173c30">CheckoutCheck — System Architecture</text><text x="60" y="104" font-family="Arial" font-size="21" fill="#56716a">Layered view of the deployed application, vision services and measured COOL workload</text><rect x="40" y="145" width="1720" height="225" rx="16" fill="#fff" stroke="#cddbd5" stroke-width="2"/><text x="64" y="183" font-family="Arial" font-size="19" font-weight="bold" letter-spacing="1" fill="#526b61">ACCESS + APPLICATION LAYER</text><rect x="70" y="205" width="380" height="125" rx="11" fill="#eaf5ff" stroke="#3782b6" stroke-width="2"/><text x="90" y="239" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Judge / community browser</text><text x="90" y="270" font-family="Arial" font-size="19" fill="#455f54">CloudFront HTTPS</text><text x="90" y="297" font-family="Arial" font-size="19" fill="#455f54">Restricted nginx origin</text><rect x="490" y="205" width="380" height="125" rx="11" fill="#e8f5ec" stroke="#41865c" stroke-width="2"/><text x="510" y="239" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Public review service</text><text x="510" y="270" font-family="Arial" font-size="19" fill="#455f54">Read-only FastAPI</text><text x="510" y="297" font-family="Arial" font-size="19" fill="#455f54">Inspect, compare and export</text><rect x="930" y="205" width="350" height="125" rx="11" fill="#eaf5ff" stroke="#3782b6" stroke-width="2"/><text x="950" y="239" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Private operator</text><text x="950" y="270" font-family="Arial" font-size="19" fill="#455f54">IAM-authorized SSM tunnel</text><text x="950" y="297" font-family="Arial" font-size="19" fill="#455f54">Upload and run evaluations</text><rect x="1320" y="205" width="400" height="125" rx="11" fill="#eaf5ff" stroke="#3782b6" stroke-width="2"/><text x="1340" y="239" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Private FastAPI</text><text x="1340" y="270" font-family="Arial" font-size="19" fill="#455f54">Validated requests</text><text x="1340" y="297" font-family="Arial" font-size="19" fill="#455f54">SQLite-backed job queue</text><path d="M450 267H490" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M1280 267H1320" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="405" width="1720" height="300" rx="16" fill="#fff" stroke="#cddbd5" stroke-width="2"/><text x="64" y="443" font-family="Arial" font-size="19" font-weight="bold" letter-spacing="1" fill="#526b61">CORE VISION + EVALUATION SERVICES · AWS EC2</text><rect x="70" y="470" width="300" height="140" rx="11" fill="#f2f5f6" stroke="#8b9ca5" stroke-width="2"/><text x="90" y="504" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Bounded worker</text><text x="90" y="535" font-family="Arial" font-size="19" fill="#455f54">Sequential jobs</text><text x="90" y="562" font-family="Arial" font-size="19" fill="#455f54">Timeouts and cancellation</text><text x="90" y="589" font-family="Arial" font-size="19" fill="#455f54">CloudWatch logs</text><rect x="410" y="470" width="320" height="140" rx="11" fill="#fff3df" stroke="#d18a28" stroke-width="2"/><text x="430" y="504" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">OpenCV 5</text><text x="430" y="535" font-family="Arial" font-size="19" fill="#455f54">Decode and preprocess</text><text x="430" y="562" font-family="Arial" font-size="19" fill="#455f54">Sharpness / foreground</text><text x="430" y="589" font-family="Arial" font-size="19" fill="#455f54">SIFT / video diagnostics</text><rect x="770" y="470" width="390" height="140" rx="11" fill="#f3edfc" stroke="#8c67b4" stroke-width="2"/><text x="790" y="504" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Vision investigation agent</text><text x="790" y="535" font-family="Arial" font-size="19" fill="#455f54">Observations choose next tool</text><text x="790" y="562" font-family="Arial" font-size="19" fill="#455f54">Watershed or neural detector</text><text x="790" y="589" font-family="Arial" font-size="19" fill="#455f54">Maximum three tool calls</text><rect x="1200" y="470" width="520" height="140" rx="11" fill="#e8f5ec" stroke="#41865c" stroke-width="2"/><text x="1220" y="504" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Evaluation + human inspection</text><text x="1220" y="535" font-family="Arial" font-size="19" fill="#455f54">Reference labels used only for scoring</text><text x="1220" y="562" font-family="Arial" font-size="19" fill="#455f54">Record decisions, failures and timings</text><text x="1220" y="589" font-family="Arial" font-size="19" fill="#455f54">Recommend inspection; no enforcement</text><path d="M1520 330V385H220V470" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M370 540H410" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M730 540H770" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M1160 540H1200" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><text x="410" y="665" font-family="Arial" font-size="20" fill="#526b61">OpenCV observations drive tool selection; detection scores and task completion are evaluated separately.</text><rect x="40" y="740" width="1100" height="365" rx="16" fill="#fff" stroke="#cddbd5" stroke-width="2"/><text x="64" y="778" font-family="Arial" font-size="19" font-weight="bold" letter-spacing="1" fill="#526b61">STORAGE + OBSERVABILITY</text><rect x="70" y="805" width="470" height="120" rx="11" fill="#eaf5ff" stroke="#3782b6" stroke-width="2"/><text x="90" y="839" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Private encrypted S3</text><text x="90" y="870" font-family="Arial" font-size="19" fill="#455f54">Original images, clips and weights</text><text x="90" y="897" font-family="Arial" font-size="19" fill="#455f54">Approved source artifacts</text><rect x="580" y="805" width="530" height="120" rx="11" fill="#e8f5ec" stroke="#41865c" stroke-width="2"/><text x="600" y="839" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">EC2 volume + SQLite</text><text x="600" y="870" font-family="Arial" font-size="19" fill="#455f54">Results, traces and database backups</text><text x="600" y="897" font-family="Arial" font-size="19" fill="#455f54">Generated evidence remains on EC2</text><rect x="70" y="955" width="470" height="110" rx="11" fill="#f2f5f6" stroke="#8b9ca5" stroke-width="2"/><text x="90" y="989" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">CloudWatch</text><text x="90" y="1020" font-family="Arial" font-size="19" fill="#455f54">Application logs and job diagnostics</text><rect x="580" y="955" width="530" height="110" rx="11" fill="#e8f5ec" stroke="#41865c" stroke-width="2"/><text x="600" y="989" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Read-only review snapshot</text><text x="600" y="1020" font-family="Arial" font-size="19" fill="#455f54">Consistent copy for the public service</text><path d="M305 805V725H220V610" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M1460 610V725H845V805" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M845 925V955" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M845 1065V1125H1780V390H680V330" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="1180" y="740" width="580" height="365" rx="16" fill="#fff" stroke="#cddbd5" stroke-width="2"/><text x="1204" y="778" font-family="Arial" font-size="19" font-weight="bold" letter-spacing="1" fill="#526b61">SEPARATE COOL BENCHMARK</text><rect x="1210" y="805" width="520" height="120" rx="11" fill="#fff3df" stroke="#d18a28" stroke-width="2"/><text x="1230" y="839" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Official COOL on AWS Graviton</text><text x="1230" y="870" font-family="Arial" font-size="19" fill="#455f54">c8g.large · OpenCV 5.1.0-dev</text><text x="1230" y="897" font-family="Arial" font-size="19" fill="#455f54">Same real inputs and application pipelines</text><rect x="1210" y="955" width="520" height="110" rx="11" fill="#f3edfc" stroke="#8c67b4" stroke-width="2"/><text x="1230" y="989" font-family="Arial" font-size="23" font-weight="bold" fill="#223e34">Stock OpenCV comparison</text><text x="1230" y="1020" font-family="Arial" font-size="19" fill="#455f54">Raw reports retained on project EC2</text><text x="1230" y="1047" font-family="Arial" font-size="19" fill="#455f54">Benchmark instance terminated</text><path d="M1470 925V955" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M1210 1010H1148V865H1110" fill="none" stroke="#56716a" stroke-width="2.5" marker-end="url(#a)"/><text x="60" y="1160" font-family="Arial" font-size="18" fill="#56716a">Public access exposes review operations only. Private execution and licensed source inputs remain under operator control.</text></svg>