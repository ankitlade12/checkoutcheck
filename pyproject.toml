[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "checkoutcheck"
version = "0.1.0"
description = "Reproducible evaluation of camera-assisted checkout decisions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
checkoutcheck = "checkoutcheck.__main__:main"

[tool.setuptools.packages.find]
include = ["checkoutcheck*"]
