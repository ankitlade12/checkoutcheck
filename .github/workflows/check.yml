name: Software checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CPU-only dependencies
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: |
          node --check apps/web/evidence.js
          node --check apps/web/app.js
          node --check apps/web/perception.js
          node --check apps/web/videos.js
      # Real-data browser/inference checks run separately with licensed originals.
