services:
  workbench:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - checkoutcheck_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2
volumes:
  checkoutcheck_data:
